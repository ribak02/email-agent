[project]
name = "email-agent"
version = "0.1.0"
description = "WhatsApp → LangGraph → Microsoft Graph API email agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "langgraph>=0.2.60,<1",
    "langgraph-checkpoint-postgres>=2,<3",
    "langchain-openai>=0.3,<1",
    "pydantic-ai>=0.0.22,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "msal>=1.31,<2",
    "httpx>=0.28,<1",
    "asyncpg>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "redis[hiredis]>=5.2,<6",
    "cryptography>=44,<45",
    "python-dotenv>=1,<2",
    "structlog>=24,<25",
    "tenacity>=9,<10",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]
